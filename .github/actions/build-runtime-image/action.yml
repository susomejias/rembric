name: Build runtime image
description: >
  Build a Rembric app's production image for a single native platform. The
  Dockerfile and stage are inputs. Defaults are the published web image's
  (distroless) `runner` stage, which CI's docker-build-check builds in
  mode=load; docker-publish.yml passes them explicitly in mode=digest,
  push-by-digest. The caller handles checkout and GHCR login.

inputs:
  image:
    description: Image name (no tag), e.g. ghcr.io/owner/rembric.
    required: true
  platform:
    description: Single build platform, e.g. linux/amd64.
    required: true
  mode:
    description: >-
      'load' (build + load into the daemon as <image>:latest) or 'digest'
      (push by digest, no tag).
    required: true
  cache-scope:
    description: GHA cache scope (keep per-arch to avoid cross-eviction).
    required: true
  export-cache:
    description: Export digest build cache to GHA (release imports only).
    required: false
    default: 'true'
  dockerfile:
    description: >
      Dockerfile to build, relative to the repo-root build context. Defaults to
      the published web image, so a caller that omits it builds the artifact the
      release channel ships.
    required: false
    default: ./apps/web/Dockerfile
  target:
    description: >
      Stage to produce. Defaults to the web image's `runner` stage.
    required: false
    default: runner
  hf-token:
    description: >
      Hugging Face read token for the model bake (optional; falls back to
      anonymous + retry).
    required: false
    default: ''

outputs:
  digest:
    description: The pushed image digest (mode=digest only).
    value: ${{ steps.digest.outputs.digest }}

runs:
  using: composite
  steps:
    - uses: docker/setup-buildx-action@v4

    - name: Build (load into daemon)
      if: inputs.mode == 'load'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platform }}
        push: false
        load: true
        tags: ${{ inputs.image }}:latest
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: type=gha,mode=max,scope=${{ inputs.cache-scope }}
        secrets: |
          hf_token=${{ inputs.hf-token }}

    - name: Build and push by digest (native — no QEMU)
      id: build_digest
      if: inputs.mode == 'digest'
      uses: docker/build-push-action@v7
      with:
        context: .
        file: ${{ inputs.dockerfile }}
        target: ${{ inputs.target }}
        platforms: ${{ inputs.platform }}
        outputs: "type=image,name=${{ inputs.image }},push-by-digest=true,\
          name-canonical=true,push=true"
        cache-from: type=gha,scope=${{ inputs.cache-scope }}
        cache-to: >-
          ${{ inputs.export-cache == 'true' &&
          format('type=gha,mode=max,scope={0}', inputs.cache-scope) || '' }}
        secrets: |
          hf_token=${{ inputs.hf-token }}

    - name: Surface digest
      id: digest
      shell: bash
      run: |
        echo "digest=${{ steps.build_digest.outputs.digest }}" \
          >> "$GITHUB_OUTPUT"
