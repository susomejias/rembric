name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v4
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Build (artifact sanity)
        run: pnpm run build

  docker-build-check:
    # Catches Dockerfile / dependency / native-module regressions before
    # they reach a release publish. Single-arch (linux/amd64 native on
    # ubuntu-latest) — multi-arch is validated only at release publish
    # time via .github/workflows/docker-publish.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Build runtime (prod) target
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker-build-check-runtime
          cache-to: type=gha,mode=max,scope=docker-build-check-runtime

      - name: Build dev target
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          target: dev
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker-build-check-dev
          cache-to: type=gha,mode=max,scope=docker-build-check-dev
