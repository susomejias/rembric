name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  spec-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    concurrency:
      group: spec-provenance-${{ github.sha }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check published-spec provenance
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-spec-provenance.mjs --base "$BASE" --head "$HEAD"

      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replay the measured violation window
        run: pnpm --filter @rembric/web exec vitest run --root ../.. scripts/check-spec-provenance.history.test.ts

  static:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Check active OpenSpec deltas are not stale
        run: pnpm run check:delta-freshness

      - name: Check active OpenSpec deltas file each requirement under the right section
        run: pnpm run check:delta-sections

      - name: Check published specs carry no dangling requirement cross-reference
        run: pnpm run check:spec-crossrefs

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMBRIC_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.model-cache
          key: embedder-${{ hashFiles('packages/core/scripts/fetch-model.mjs', 'packages/core/src/embeddings/embedder.ts', 'packages/core/src/embeddings/model-identity.json') }}

      - name: Prefetch embedding model (retried, offline-resolvable)
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: packages/core
        run: node scripts/fetch-model.mjs "$REMBRIC_MODEL_CACHE"

      - name: Build (artifact sanity)
        run: pnpm run build

      - name: Test
        run: |
          pnpm run test:coverage
          pnpm run test:hermes-plugin

      - name: Upload test results on failure
        if: failure()
        uses: actions/upload-artifact@v6
        with:
          name: test-results
          path: apps/web/test-results.json
          if-no-files-found: ignore

      - name: Check for rescued tests
        working-directory: apps/web
        run: node ../../scripts/check-rescued-tests.mjs test-results.json

      - name: Installer e2e (headless)
        run: pnpm run e2e:installer

  retrieval-eval:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMBRIC_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.model-cache
          key: embedder-${{ hashFiles('packages/core/scripts/fetch-model.mjs', 'packages/core/src/embeddings/embedder.ts', 'packages/core/src/embeddings/model-identity.json') }}

      - name: Prefetch embedding model (retried, offline-resolvable)
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: packages/core
        run: node scripts/fetch-model.mjs "$REMBRIC_MODEL_CACHE"

      - name: Retrieval eval
        run: pnpm run eval

  changes:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    outputs:
      docker: ${{ steps.filter.outputs.docker }}
    steps:
      - uses: actions/checkout@v7
        if: github.event_name == 'pull_request'
        with:
          fetch-depth: 0
          filter: blob:none

      - id: filter
        env:
          EVENT: ${{ github.event_name }}
          BASE: ${{ github.event.pull_request.base.sha }}
          HEAD: ${{ github.event.pull_request.head.sha }}
        run: |
          if [ "$EVENT" = pull_request ]; then
            node scripts/docker-relevant-changes.mjs --base "$BASE" --head "$HEAD"
          else
            echo docker=true >> "$GITHUB_OUTPUT"
          fi

  docker-build-check:
    needs: changes
    if: ${{ !cancelled() }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - name: Skip — this change cannot reach the image
        if: needs.changes.outputs.docker == 'false'
        run: echo "No changed path reaches the image or the installer's server path."

      - uses: actions/checkout@v7
        if: needs.changes.outputs.docker != 'false'

      - name: Build runtime (prod) target
        if: needs.changes.outputs.docker != 'false'
        uses: ./.github/actions/build-runtime-image
        with:
          image: ghcr.io/susomejias/rembric
          platform: linux/${{ matrix.arch }}
          mode: load
          cache-scope: web-runtime-${{ matrix.arch }}
          export-cache: ${{ github.event_name == 'push' }}
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Boot smoke — healthz, data dir, 39 migrations
        if: needs.changes.outputs.docker != 'false'
        run: |
          set -eu
          TOK=ci-boot-token-0123456789
          D="$(mktemp -d)"; mkdir -p "$D/data" && chmod 0777 "$D/data"
          docker run -d --name rembric-boot-smoke \
            -e REMBRIC_ADMIN_TOKEN="$TOK" \
            -v "$D/data:/data" \
            -p 127.0.0.1:8791:8787 \
            ghcr.io/susomejias/rembric:latest
          ok=
          for _ in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOK" \
              http://127.0.0.1:8791/healthz || true)
            [ "$c" = 200 ] && { ok=1; break; }
            sleep 3
          done
          LOGS="$(docker logs rembric-boot-smoke 2>&1 || true)"
          if [ -z "$ok" ]; then
            echo "::error::${{ matrix.arch }} /healthz never returned 200"
            echo "$LOGS"
            exit 1
          fi
          echo "$LOGS" \
            | grep -q '\[db\] data file /data/data.db (pre-existing: false)' \
            || { echo "::error::${{ matrix.arch }} boot did not open /data/data.db"; \
                 echo "$LOGS"; exit 1; }
          applied=$(echo "$LOGS" | grep -c '\[migrate\] applying' || true)
          [ "$applied" = 39 ] \
            || { echo "::error::expected 39 migrations, got $applied"; \
                 echo "$LOGS"; exit 1; }
          echo "${{ matrix.arch }} boot smoke: healthz=200, /data/data.db, 39 migrations ✓"
          docker rm -f rembric-boot-smoke

      - name: Installer e2e — server --up against the built image
        if: matrix.arch == 'amd64' && needs.changes.outputs.docker != 'false'
        run: |
          set -eu
          TOK=ci-e2e-token-0123456789
          REPO="$PWD"; T="$(mktemp -d)"; cd "$T"
          mkdir -p data && chmod 0777 data
          REMBRIC_SRC="$REPO" REMBRIC_NONINTERACTIVE=1 REMBRIC_UPDATE_CHECK=off REMBRIC_NO_PULL=1 \
            sh "$REPO/install.sh" --server --action=install --up --token="$TOK" --port=8799
          ok=
          for _ in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" http://127.0.0.1:8799/healthz || true)
            [ "$c" = 200 ] && { ok=1; break; }
            sleep 3
          done
          if [ -z "$ok" ]; then echo "::error::/healthz never returned 200"; docker compose logs || true; exit 1; fi
          d=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/dashboard || true)
          echo "healthz=200 dashboard=$d"
          case "$d" in 200 | 302) ;; *) echo "::error::unexpected /dashboard status $d"; exit 1 ;; esac
          docker compose down
