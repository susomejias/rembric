name: CI

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v6

      - uses: actions/setup-node@v6
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v5
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Install with --frozen-lockfile. pnpm 11 enforces three independent
      # invariants in this step that cover the lockfile-injection attack
      # class (practice #5 of lirantal/npm-security-best-practices):
      #   1. Lockfile must exactly match package.json (no silent updates).
      #   2. Every tarball's integrity hash must match what the lockfile
      #      claims (defends against URL swap + content tampering).
      #   3. blockExoticSubdeps in pnpm-workspace.yaml refuses non-registry
      #      transitive sources (git URLs, off-registry tarballs).
      # (lockfile-lint v4.x doesn't support pnpm-lock.yaml; the npm-native
      # defenses + blockExoticSubdeps cover the same threat model.)
      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm test

      - name: Installer e2e (headless)
        run: pnpm run e2e:installer

      - name: Build (artifact sanity)
        run: pnpm run build

  docker-build-check:
    # Catches Dockerfile / dependency / native-module regressions before
    # they reach a release publish. Single-arch (linux/amd64 native on
    # ubuntu-latest) — multi-arch is validated only at release publish
    # time via .github/workflows/docker-publish.yml.
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Build runtime (prod) target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/server/Dockerfile
          target: runtime
          platforms: linux/amd64
          push: false
          # Load into the daemon as :latest so the installer e2e below can bring
          # it up without pulling from GHCR (REMBRIC_NO_PULL).
          load: true
          tags: ghcr.io/susomejias/rembric:latest
          cache-from: type=gha,scope=docker-build-check-runtime
          cache-to: type=gha,mode=max,scope=docker-build-check-runtime
          # Empty on fork PRs (no secrets) → model bake falls back to anonymous + retry.
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Build dev target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/server/Dockerfile
          target: dev
          platforms: linux/amd64
          push: false
          cache-from: type=gha,scope=docker-build-check-dev
          cache-to: type=gha,mode=max,scope=docker-build-check-dev
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      # Real end-to-end of the installer's server bring-up: drive the actual
      # `install.sh --server --up` against the locally-built image (REMBRIC_NO_PULL
      # so it uses the loaded :latest, no GHCR), then assert the server answers.
      - name: Installer e2e — server --up against the built image
        run: |
          set -eu
          TOK=ci-e2e-token-0123456789   # >=16 chars (server rejects shorter)
          REPO="$PWD"; T="$(mktemp -d)"; cd "$T"
          REMBRIC_SRC="$REPO" REMBRIC_NONINTERACTIVE=1 REMBRIC_UPDATE_CHECK=off REMBRIC_NO_PULL=1 \
            sh "$REPO/install.sh" --server --action=install --up --token="$TOK" --port=8787
          ok=
          for _ in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" http://127.0.0.1:8787/healthz || true)
            [ "$c" = 200 ] && { ok=1; break; }
            sleep 3
          done
          if [ -z "$ok" ]; then echo "::error::/healthz never returned 200"; docker compose logs || true; exit 1; fi
          d=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8787/dashboard || true)
          echo "healthz=200 dashboard=$d"
          case "$d" in 200 | 302) ;; *) echo "::error::unexpected /dashboard status $d"; exit 1 ;; esac
          docker compose down
