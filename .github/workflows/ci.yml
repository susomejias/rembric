name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Provenance only: proves a published-spec edit arrived through a change folder,
  # NOT that the spec text is true. A green run says nothing about correctness.
  spec-provenance:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    # Its own group, never cancelled: the workflow-level `cancel-in-progress` is
    # keyed on `github.ref`, so all pushes to main share one group and a second
    # push cancels the first. A violating direct push would be cancelled rather
    # than red — and five of the eight measured violations were direct pushes.
    # Same lesson release-please already learned.
    concurrency:
      group: spec-provenance-${{ github.sha }}
      cancel-in-progress: false
    steps:
      # fetch-depth: 0 — a diff-based check cannot resolve a base ref from a
      # single commit. The other jobs stay shallow; they need no history.
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Check published-spec provenance
        env:
          BASE: ${{ github.event_name == 'pull_request' && github.event.pull_request.base.sha || github.event.before }}
          HEAD: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.sha || github.sha }}
        run: node scripts/check-spec-provenance.mjs --base "$BASE" --head "$HEAD"

      # The historical replay lives here rather than in `test`, which checks out
      # at depth 1: this measurement is the gate's central evidence and it cannot
      # run without history. Excluded from the default vitest include so it fails
      # loudly here instead of silently skipping there.
      - uses: pnpm/action-setup@v6
      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Replay the measured violation window
        working-directory: apps/server
        run: pnpm exec vitest run ../../scripts/check-spec-provenance.history.test.ts

  test:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMBRIC_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      # Install with --frozen-lockfile. pnpm 11 enforces three independent
      # invariants in this step that cover the lockfile-injection attack
      # class (practice #5 of lirantal/npm-security-best-practices):
      #   1. Lockfile must exactly match package.json (no silent updates).
      #   2. Every tarball's integrity hash must match what the lockfile
      #      claims (defends against URL swap + content tampering).
      #   3. blockExoticSubdeps in pnpm-workspace.yaml refuses non-registry
      #      transitive sources (git URLs, off-registry tarballs).
      # (lockfile-lint v4.x doesn't support pnpm-lock.yaml; the npm-native
      # defenses + blockExoticSubdeps cover the same threat model.)
      - name: Install
        run: pnpm install --frozen-lockfile

      # The embedding model is fetched from the HF CDN at load time on
      # bare-metal runners (the /app/models bake exists only in the Docker
      # image). Prefetch it once into a cached local-model dir — keyed on the
      # pinned revision — so the real-embedder suite resolves it OFFLINE and a
      # transient CDN blip can no longer false-red the build.
      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.model-cache
          key: embedder-${{ hashFiles('packages/core/scripts/fetch-model.mjs', 'packages/core/src/embeddings/embedder.ts') }}

      - name: Prefetch embedding model (retried, offline-resolvable)
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: packages/core
        run: node scripts/fetch-model.mjs "$REMBRIC_MODEL_CACHE"

      - name: Lint
        run: pnpm run lint

      - name: Format
        run: pnpm run format:check

      - name: Typecheck
        run: pnpm run typecheck

      # A working-tree property, so it runs here on the shallow checkout rather
      # than in `spec-provenance`, which needs fetch-depth: 0 for its diff.
      - name: Check active OpenSpec deltas are not stale
        run: pnpm run check:delta-freshness

      - name: Check active OpenSpec deltas file each requirement under the right section
        run: pnpm run check:delta-sections

      - name: Check published specs carry no dangling requirement cross-reference
        run: pnpm run check:spec-crossrefs

      # Server suite runs WITH coverage so the vitest thresholds actually gate
      # PRs; the Hermes plugin's Python tests run separately (they have no
      # coverage gate). Together these cover what `pnpm test` runs.
      - name: Test
        run: |
          pnpm --filter @rembric/server run test:coverage
          pnpm run test:hermes-plugin

      # A rescued test passes after retry but carries stale failureMessages.
      # Vitest reports it green; this gate fails the run instead.
      - name: Check for rescued tests
        working-directory: apps/server
        run: node ../../scripts/check-rescued-tests.mjs test-results.json

      - name: Installer e2e (headless)
        run: pnpm run e2e:installer

      - name: Build (artifact sanity)
        run: pnpm run build

  retrieval-eval:
    # Separate from `test` (design.md Decision 7): this ingests a corpus
    # through a real embedding model, which does not belong in the inner-loop
    # unit suite. Reuses the same model cache key as `test` for a warm cache.
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      REMBRIC_MODEL_CACHE: ${{ github.workspace }}/.model-cache
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      - name: Enable corepack
        run: corepack enable

      - name: Cache pnpm store
        uses: actions/cache@v6
        with:
          path: ~/.local/share/pnpm/store
          key: ${{ runner.os }}-pnpm-${{ hashFiles('pnpm-lock.yaml') }}
          restore-keys: |
            ${{ runner.os }}-pnpm-

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Cache embedding model
        id: model-cache
        uses: actions/cache@v6
        with:
          path: ${{ github.workspace }}/.model-cache
          key: embedder-${{ hashFiles('packages/core/scripts/fetch-model.mjs', 'packages/core/src/embeddings/embedder.ts') }}

      - name: Prefetch embedding model (retried, offline-resolvable)
        if: steps.model-cache.outputs.cache-hit != 'true'
        working-directory: packages/core
        run: node scripts/fetch-model.mjs "$REMBRIC_MODEL_CACHE"

      - name: Retrieval eval
        run: pnpm run eval

  docker-build-check:
    # Safety net that mirrors the release-publish path so a build break is
    # caught at PR time, not at publish. The publish builds the (distroless)
    # runtime stage NATIVELY on two arches — so this check does too:
    #   • amd64 (ubuntu-latest)      — builds runtime + dev, then the full
    #                                   installer e2e (install.sh --server --up).
    #   • arm64 (ubuntu-24.04-arm)   — builds runtime, then a boot smoke. The
    #                                   embedder loads EAGERLY at boot, so a
    #                                   clean boot proves the arm64 glibc native
    #                                   modules (onnxruntime-node, better-sqlite3,
    #                                   sqlite-vec) + baked model actually work.
    # Both native arm runners are free for public repos. No QEMU.
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      # Same composite action the release publish uses (mode=load here vs
      # mode=digest there) — one place defines how an app image is built. This
      # call omits the action's `dockerfile`/`target` inputs, so it keeps
      # building the server image's `runtime` stage; the publish overrides them
      # with the web image (apps/web/Dockerfile, `runner`).
      # Loaded as :latest so the e2e / boot smoke below bring it up without
      # pulling from GHCR (REMBRIC_NO_PULL).
      - name: Build runtime (prod) target
        uses: ./.github/actions/build-runtime-image
        with:
          image: ghcr.io/susomejias/rembric
          platform: linux/${{ matrix.arch }}
          mode: load
          # CI-local since the publish moved off the server image: the release
          # now builds apps/web/Dockerfile under the `web-runtime-<arch>` scope
          # that docker-build-check-web owns. Still per-arch, and still the
          # scope the dev build below imports.
          cache-scope: runtime-${{ matrix.arch }}
          # Empty on fork PRs (no secrets) → model bake falls back to anonymous + retry.
          hf-token: ${{ secrets.HF_TOKEN }}

      - name: Build dev target
        if: matrix.arch == 'amd64'
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/server/Dockerfile
          target: dev
          platforms: linux/amd64
          push: false
          # Import the runtime leg's builder layers (incl. the baked model) so the
          # dev build reuses them instead of re-fetching — dev now COPYs the model
          # from the builder stage.
          cache-from: |
            type=gha,scope=runtime-amd64
            type=gha,scope=docker-build-check-dev
          cache-to: type=gha,mode=max,scope=docker-build-check-dev
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      # amd64: real end-to-end of the installer's server bring-up — drive the
      # actual `install.sh --server --up` against the locally-built image
      # (REMBRIC_NO_PULL → uses the loaded :latest, no GHCR), then assert.
      - name: Installer e2e — server --up against the built image
        if: matrix.arch == 'amd64'
        run: |
          set -eu
          TOK=ci-e2e-token-0123456789   # >=16 chars (server rejects shorter)
          REPO="$PWD"; T="$(mktemp -d)"; cd "$T"
          # The image runs as uid 10001; on rootful Linux docker the ./data bind
          # would be auto-created root-owned and the server couldn't open its DB.
          # Pre-create it world-writable (Docker Desktop sidesteps this locally).
          mkdir -p data && chmod 0777 data
          # Non-default port deliberately: it's the only way this step would
          # have caught #338 (REMBRIC_PORT customised in .env left the
          # container unreachable — docker-compose.yml hard-coded the
          # container side of the mapping to 8787 regardless).
          REMBRIC_SRC="$REPO" REMBRIC_NONINTERACTIVE=1 REMBRIC_UPDATE_CHECK=off REMBRIC_NO_PULL=1 \
            sh "$REPO/install.sh" --server --action=install --up --token="$TOK" --port=8799
          ok=
          for _ in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" http://127.0.0.1:8799/healthz || true)
            [ "$c" = 200 ] && { ok=1; break; }
            sleep 3
          done
          if [ -z "$ok" ]; then echo "::error::/healthz never returned 200"; docker compose logs || true; exit 1; fi
          d=$(curl -s -o /dev/null -w '%{http_code}' http://127.0.0.1:8799/dashboard || true)
          echo "healthz=200 dashboard=$d"
          case "$d" in 200 | 302) ;; *) echo "::error::unexpected /dashboard status $d"; exit 1 ;; esac
          docker compose down

      # arm64: boot smoke — run the just-built distroless image natively and
      # wait for /healthz. A clean boot proves the arm64 glibc native modules +
      # the eagerly-loaded embedding model work (the install.sh path is
      # exercised on amd64; here we only need to confirm the arm64 image runs).
      - name: Boot smoke — arm64 distroless runtime
        if: matrix.arch == 'arm64'
        run: |
          set -eu
          TOK=ci-e2e-token-0123456789
          D="$(mktemp -d)"; mkdir -p "$D/data" && chmod 0777 "$D/data"
          docker run -d --name rembric-arm64-smoke \
            -e REMBRIC_ADMIN_TOKEN="$TOK" \
            -v "$D/data:/data" \
            -p 127.0.0.1:8787:8787 \
            ghcr.io/susomejias/rembric:latest
          ok=
          for _ in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' -H "Authorization: Bearer $TOK" http://127.0.0.1:8787/healthz || true)
            [ "$c" = 200 ] && { ok=1; break; }
            sleep 3
          done
          if [ -z "$ok" ]; then echo "::error::arm64 /healthz never returned 200"; docker logs rembric-arm64-smoke || true; exit 1; fi
          # Assert the embedder warmed (eager load); its absence means the native
          # modules failed silently before listening.
          docker logs rembric-arm64-smoke 2>&1 | grep -q 'embedding model loaded' \
            || { echo "::error::arm64 embedder did not load"; docker logs rembric-arm64-smoke; exit 1; }
          echo "arm64 boot smoke: healthz=200, embedder loaded ✓"
          docker rm -f rembric-arm64-smoke

  docker-build-check-web:
    # The published image is the Next.js one (apps/web/Dockerfile, `runner`):
    # docker-publish.yml builds exactly this Dockerfile and stage through the
    # shared composite action. The server image above is still built and booted
    # here because the installer e2e exercises it, not because the channel
    # publishes it.
    #
    # amd64 only, on purpose. The build is platform-independent apart from
    # the onnxruntime prebuilt, and the arch-specific part — the prune that
    # drops the non-target binaries — asserts the surviving binding at
    # build time. arm64 coverage stays on the server image so this check
    # does not double the job's cost.
    #
    # The boot smoke is the real gate: the build-time checks run inside the
    # image, while this proves the assembled tree starts, migrates and
    # answers on the host.
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7

      - uses: docker/setup-buildx-action@v4

      - name: Build runtime target
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./apps/web/Dockerfile
          target: runner
          platforms: linux/amd64
          push: false
          load: true
          tags: rembric-web:ci
          # Separate scope from the server image's: the two builds share the
          # pnpm/native layers but not their builder stages. docker-publish.yml
          # uses this same scope for the web image, so the merge-to-main that
          # precedes a release leaves the publish warm.
          cache-from: type=gha,scope=web-runtime-amd64
          cache-to: type=gha,mode=max,scope=web-runtime-amd64
          # Empty on fork PRs (no secrets) -> anonymous model bake, retried.
          secrets: |
            hf_token=${{ secrets.HF_TOKEN }}

      - name: Boot smoke — healthz, data dir, 37 migrations
        run: |
          set -eu
          TOK=ci-web-token-0123456789
          # The image runs as uid 10001; a host dir created by a rootful
          # docker would be root-owned and the server could not open its DB.
          D="$(mktemp -d)"; mkdir -p "$D/data" && chmod 0777 "$D/data"
          docker run -d --name rembric-web-smoke \
            -e REMBRIC_ADMIN_TOKEN="$TOK" \
            -v "$D/data:/data" \
            -p 127.0.0.1:8791:8787 \
            rembric-web:ci
          ok=
          for _ in $(seq 1 60); do
            c=$(curl -s -o /dev/null -w '%{http_code}' \
              -H "Authorization: Bearer $TOK" \
              http://127.0.0.1:8791/healthz || true)
            [ "$c" = 200 ] && { ok=1; break; }
            sleep 3
          done
          LOGS="$(docker logs rembric-web-smoke 2>&1 || true)"
          if [ -z "$ok" ]; then
            echo "::error::web /healthz never returned 200"
            echo "$LOGS"
            exit 1
          fi
          # DS1/DS3: the boot must resolve the mounted volume, not a fresh
          # data.db in the container's ephemeral layer.
          echo "$LOGS" \
            | grep -q '\[db\] data file /data/data.db (pre-existing: false)' \
            || { echo "::error::web boot did not open /data/data.db"; \
                 echo "$LOGS"; exit 1; }
          # The migrations dir arrives through outputFileTracingIncludes, so
          # a boot that applies fewer than 37 means that path broke silently.
          applied=$(echo "$LOGS" | grep -c '\[migrate\] applying' || true)
          [ "$applied" = 37 ] \
            || { echo "::error::expected 37 migrations, got $applied"; \
                 echo "$LOGS"; exit 1; }
          echo "web boot smoke: healthz=200, /data/data.db, 37 migrations ✓"
          docker rm -f rembric-web-smoke
