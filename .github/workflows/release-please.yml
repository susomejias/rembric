name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish the current main even if no release was created (server only)'
        type: boolean
        default: false
      plugin_release_tag:
        description: 'Promote, or roll back, plugin-release to this plugin-vX.Y.Z tag'
        type: string
        default: ''

permissions:
  contents: write
  pull-requests: write
  packages: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    # Serialize tag-minting across runs on main so a rapid second merge never
    # cancels the first run's release. Scoped to this job so a publish still
    # running from an earlier release never queues the next one.
    concurrency:
      group: release-please-${{ github.ref }}
      cancel-in-progress: false
    outputs:
      # Multi-component manifest mode: release-please-action exposes
      # `releases_created` (object keyed by package path) and `paths_released`
      # (JSON array of paths). We forward the raw outputs and let the
      # publish-docker condition gate on the `server` component's release.
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      # The `server` component is anchored on the repository root, and the
      # action emits a root component's outputs unprefixed; every other
      # component's outputs carry its path as a prefix.
      server_release_created: ${{ steps.release.outputs.release_created }}
      server_tag_name: ${{ steps.release.outputs.tag_name }}
      plugin_release_created: ${{ steps.release.outputs['apps/plugin--release_created'] }}
      plugin_tag_name: ${{ steps.release.outputs['apps/plugin--tag_name'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    # Reusable workflow call — `release.created` events from GITHUB_TOKEN
    # don't trigger other workflows, so we invoke docker-publish.yml in the
    # same workflow run via workflow_call (which IS permitted with the
    # auto-issued token).
    #
    # Gating: only runs when the `server` component was released. A `plugin`
    # release (the unified plugin track covering all five clients) does NOT
    # trigger Docker publish.
    needs: release-please
    if: ${{ needs.release-please.outputs.server_release_created == 'true' || github.event.inputs.force_publish == 'true' }}
    concurrency:
      group: publish-docker-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.server_tag_name }}
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}
    permissions:
      contents: read
      packages: write

  publish-npm:
    # `@rembric/pi` is a version carrier of the `plugin` component, not a
    # component of its own: a plugin release is the only trigger, and the version
    # in the manifest at this commit is already the released one.
    needs: release-please
    if: ${{ needs.release-please.outputs.plugin_release_created == 'true' }}
    runs-on: ubuntu-latest
    concurrency:
      group: publish-npm-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    # id-token is the OIDC identity for trusted publishing, scoped to this job so
    # no other job in the run can mint a publish token. No long-lived registry
    # token by policy — openspec/specs/supply-chain-hygiene/spec.md.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@^11.5.1

      # The extension imports the shared core and dotenv module from
      # apps/plugin/bin/ and references the shared command markdown, both of
      # which sit outside the package root. An explicit step copies them in and
      # rewrites the imports — never a `prepack`, whose execution depends on the
      # publish command's cwd (openspec/specs/supply-chain-hygiene/spec.md).
      - name: Materialise shared resources into the package
        run: node scripts/pi-package.mjs materialize

      - name: Assert the tarball contents
        run: node scripts/pi-package.mjs assert-pack

      # Both package assertions intentionally precede either publish. A failed
      # bridge assertion must not leave a partial release behind.
      - name: Assert the bridge tarball contents
        run: node scripts/mcp-bridge-package.mjs assert-pack

      # The registry check makes a rerun after a partial publish continue with
      # the missing package instead of failing on an already-existing version.
      - name: Publish @rembric/pi if the exact version is missing
        run: node scripts/npm-publish.mjs apps/plugin/.pi-plugin

      - name: Publish @rembric/mcp-bridge if the exact version is missing
        run: node scripts/npm-publish.mjs apps/plugin/mcp-bridge

  promote-plugin-release:
    # Clients install the plugin from `plugin-release`, never from main, so a
    # release is offered only once its exact-pinned bridge is on npm. A dispatch
    # with `plugin_release_tag` promotes or rolls back to any plugin-v* tag.
    needs: [release-please, publish-npm]
    if: ${{ !cancelled() && ((needs.release-please.outputs.plugin_release_created == 'true' && needs.publish-npm.result == 'success') || (github.event_name == 'workflow_dispatch' && inputs.plugin_release_tag != '')) }}
    runs-on: ubuntu-latest
    concurrency:
      group: promote-plugin-release-${{ github.ref }}
      cancel-in-progress: false
      queue: max
    # The ref write goes through the App token below, the only ruleset bypass
    # actor; GITHUB_TOKEN only reads.
    permissions:
      contents: read
    steps:
      - name: Resolve the target and check its bridge is on npm
        id: resolve
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_release_tag || needs.release-please.outputs.plugin_tag_name }}
        run: |
          set -euo pipefail
          if ! printf '%s' "$TAG" | grep -Eq '^plugin-v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "::error::not a plugin release tag: '$TAG'"
            exit 1
          fi
          target=$(gh api "repos/$REPO/commits/$TAG" --jq .sha)
          version=$(gh api "repos/$REPO/contents/apps/plugin/mcp-bridge/package.json?ref=$target" --jq .content | base64 -d | jq -r .version)
          published=$(curl -fsS --max-time 30 --retry 3 "https://registry.npmjs.org/@rembric%2fmcp-bridge/$version" | jq -r .version) || published=''
          if [ "$published" != "$version" ]; then
            echo "::error::@rembric/mcp-bridge@$version is not on npm; $TAG stays unpromoted"
            exit 1
          fi
          if ! current=$(gh api "repos/$REPO/git/ref/heads/plugin-release" --jq .object.sha); then
            echo "::error::branch plugin-release is missing; create it at the latest plugin-v* tag first"
            exit 1
          fi
          echo "target=$target" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$target" ]; then
            echo "plugin-release already at $TAG ($target)"
            echo "move=false" >> "$GITHUB_OUTPUT"
          else
            echo "move=true" >> "$GITHUB_OUTPUT"
          fi

      - name: Mint the plugin-release App token
        id: app-token
        if: steps.resolve.outputs.move == 'true'
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.PLUGIN_RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.PLUGIN_RELEASE_APP_PRIVATE_KEY }}
          repositories: ${{ github.event.repository.name }}
          permission-contents: write

      # Automatic promotion only fast-forwards; a dispatched rollback is a
      # non-fast-forward move, so only that path forces.
      - name: Move plugin-release
        if: steps.resolve.outputs.move == 'true'
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          REPO: ${{ github.repository }}
          TARGET: ${{ steps.resolve.outputs.target }}
          FORCE: ${{ github.event_name == 'workflow_dispatch' && inputs.plugin_release_tag != '' }}
        run: |
          set -euo pipefail
          gh api -X PATCH "repos/$REPO/git/refs/heads/plugin-release" -f sha="$TARGET" -F force="$FORCE" --jq .object.sha
