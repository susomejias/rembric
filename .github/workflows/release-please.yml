name: Release Please

on:
  push:
    branches: [main]

permissions:
  contents: write
  pull-requests: write

jobs:
  release-please:
    runs-on: ubuntu-latest
    steps:
      - uses: googleapis/release-please-action@v4
        with:
          # release-please reads versions from `.release-please-manifest.json`
          # and the per-package config in `release-please-config.json`.
          token: ${{ secrets.GITHUB_TOKEN }}
