name: Release Please

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      force_publish:
        description: 'Force publish the current main even if no release was created (server only)'
        type: boolean
        default: false

permissions:
  contents: write
  pull-requests: write
  packages: write

# Serialize runs on main so a rapid second merge never cancels the first
# run's tag-minting. cancel-in-progress: false queues instead of cancelling —
# the proximate fix for missing component tags (and lost release anchors).
concurrency:
  group: release-please-${{ github.ref }}
  cancel-in-progress: false

jobs:
  release-please:
    runs-on: ubuntu-latest
    outputs:
      # Multi-component manifest mode: release-please-action exposes
      # `releases_created` (object keyed by package path) and `paths_released`
      # (JSON array of paths). We forward the raw outputs and let the
      # publish-docker condition gate on the apps/server path.
      releases_created: ${{ steps.release.outputs.releases_created }}
      paths_released: ${{ steps.release.outputs.paths_released }}
      # apps/server-specific outputs (release-please prefixes per-path outputs)
      server_release_created: ${{ steps.release.outputs['apps/server--release_created'] }}
      server_tag_name: ${{ steps.release.outputs['apps/server--tag_name'] }}
      plugin_release_created: ${{ steps.release.outputs['apps/plugin--release_created'] }}
    steps:
      - uses: googleapis/release-please-action@v5
        id: release
        with:
          token: ${{ secrets.GITHUB_TOKEN }}

  publish-docker:
    # Reusable workflow call — `release.created` events from GITHUB_TOKEN
    # don't trigger other workflows, so we invoke docker-publish.yml in the
    # same workflow run via workflow_call (which IS permitted with the
    # auto-issued token).
    #
    # Gating: only runs when the `server` component was released. A `plugin`
    # release (the unified plugin track covering all five clients) does NOT
    # trigger Docker publish.
    needs: release-please
    if: ${{ needs.release-please.outputs.server_release_created == 'true' || github.event.inputs.force_publish == 'true' }}
    uses: ./.github/workflows/docker-publish.yml
    with:
      tag: ${{ needs.release-please.outputs.server_tag_name }}
    secrets:
      hf_token: ${{ secrets.HF_TOKEN }}
    permissions:
      contents: read
      packages: write

  publish-npm:
    # `@rembric/pi` is a version carrier of the `plugin` component, not a
    # component of its own: a plugin release is the only trigger, and the version
    # in the manifest at this commit is already the released one.
    needs: release-please
    if: ${{ needs.release-please.outputs.plugin_release_created == 'true' }}
    runs-on: ubuntu-latest
    # id-token is the OIDC identity for trusted publishing, scoped to this job so
    # no other job in the run can mint a publish token. No NPM_TOKEN by policy —
    # openspec/specs/supply-chain-hygiene/spec.md.
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          registry-url: https://registry.npmjs.org

      # Trusted publishing needs npm >= 11.5.1; Node 22 ships npm 10.x.
      - run: npm install -g npm@^11.5.1

      # The extension imports the shared core and dotenv module from
      # apps/plugin/bin/ and references the shared command markdown, both of
      # which sit outside the package root. An explicit step copies them in and
      # rewrites the imports — never a `prepack`, whose execution depends on the
      # publish command's cwd (openspec/specs/supply-chain-hygiene/spec.md).
      - name: Materialise shared resources into the package
        run: node scripts/pi-package.mjs materialize

      - name: Assert the tarball contents
        run: node scripts/pi-package.mjs assert-pack

      - name: Publish @rembric/pi
        working-directory: apps/plugin/.pi-plugin
        # --access public: a scoped package defaults to restricted on first publish.
        run: npm publish --provenance --access public
