name: Docker publish

# Triggered automatically from release-please.yml (workflow_call) when
# release-please cuts a new GH release. Also exposed via workflow_dispatch
# for manual recovery / first-time bootstrap before release-please has
# been used. The `release.created` event is intentionally NOT a trigger:
# GitHub silently drops events generated by GITHUB_TOKEN, which is what
# release-please uses, so a `release` trigger would never fire.
#
# Build model: each architecture is built NATIVELY (amd64 on ubuntu-latest,
# arm64 on ubuntu-24.04-arm — free for public repos) and pushed by digest,
# with NO QEMU emulation. Each arch smoke-tests its own digest before any
# tag exists; the merge job stitches the manifest list and promotes alias
# tags only after every arch passes. A failed arch never mints a :version
# tag — the untagged per-arch digests linger in the registry as forensics.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.13.0 or 0.13.0). Manual recovery only.'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.13.0 or 0.13.0).'
        required: true
        type: string
    secrets:
      gh_token:
        description: "Token with `packages: write`. Defaults to the caller workflow's GITHUB_TOKEN."
        required: false
      hf_token:
        description: 'Hugging Face read token for the model bake (avoids anonymous-IP 429s).'
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.tag }}
  cancel-in-progress: false

env:
  IMAGE: ghcr.io/${{ github.repository_owner }}/rembric

jobs:
  build:
    name: build (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
            platform: linux/amd64
          - arch: arm64
            runner: ubuntu-24.04-arm
            platform: linux/arm64
    runs-on: ${{ matrix.runner }}
    timeout-minutes: 20

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.gh_token || secrets.GITHUB_TOKEN }}

      - name: Build runtime (push by digest, native — no QEMU)
        id: build
        uses: ./.github/actions/build-runtime-image
        with:
          image: ${{ env.IMAGE }}
          platform: ${{ matrix.platform }}
          mode: digest
          # Shared with ci.yml's docker-build-check runtime build (same scope
          # name): the merge-to-main that precedes a release already built this
          # exact runtime image in CI, so the publish imports those builder
          # layers (model bake, install, native compile) warm instead of cold.
          cache-scope: runtime-${{ matrix.arch }}
          hf-token: ${{ secrets.hf_token }}

      - name: Smoke test this arch's digest (three independent signals)
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail

          # Pull this arch's just-pushed digest natively (the runner's own
          # architecture), so the inspected config is exactly what shipped.
          REF="$IMAGE@$DIGEST"
          docker pull "$REF"

          CMD_JSON=$(docker inspect "$REF" --format '{{json .Config.Cmd}}')
          ENT_JSON=$(docker inspect "$REF" --format '{{json .Config.Entrypoint}}')
          LABEL=$(docker inspect "$REF" --format '{{ index .Config.Labels "rembric.stage" }}')
          SIZE_BYTES=$(docker inspect "$REF" --format '{{.Size}}')
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))

          echo "Arch:       ${{ matrix.arch }}"
          echo "Cmd:        $CMD_JSON"
          echo "Entrypoint: $ENT_JSON"
          echo "Label:      rembric.stage=$LABEL"
          echo "Size:       ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          echo ""

          fail=0

          if echo "$CMD_JSON $ENT_JSON" | grep -q 'seed-dev'; then
            echo "::error::Signal 1 FAILED: 'seed-dev' found in Cmd or Entrypoint." >&2
            fail=1
          fi
          if echo "$CMD_JSON $ENT_JSON" | grep -q 'tsx watch'; then
            echo "::error::Signal 1 FAILED: 'tsx watch' found in Cmd or Entrypoint." >&2
            fail=1
          fi
          if ! echo "$ENT_JSON" | grep -q 'dist/server-entrypoint.js'; then
            echo "::error::Signal 1 FAILED: Entrypoint does not include 'dist/server-entrypoint.js'." >&2
            fail=1
          fi

          if [ "$LABEL" != "runtime" ]; then
            echo "::error::Signal 2 FAILED: rembric.stage label is '$LABEL' (expected 'runtime')." >&2
            fail=1
          fi

          # Recalibrated 2026-06-05: in-process embeddings added ~340MB model + ~280MB onnxruntime (image measured 1263MB).
          MAX_MB=1500
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "::error::Signal 3 FAILED: image size ${SIZE_MB} MB exceeds ${MAX_MB} MB threshold." >&2
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "::error::Smoke test FAILED for ${{ matrix.arch }}. The per-arch digest stays in the registry (untagged) as forensic evidence; the merge job will NOT run, so NO :version/:latest/alias tag is created." >&2
            exit 1
          fi
          echo "✓ All three smoke-test signals passed for ${{ matrix.arch }}."

      - name: Export digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          set -euo pipefail
          mkdir -p /tmp/digests
          # Strip the `sha256:` algo prefix so the bare digest is the filename payload.
          echo -n "${DIGEST#sha256:}" > "/tmp/digests/${{ matrix.arch }}"

      - name: Upload digest
        uses: actions/upload-artifact@v4
        with:
          name: digest-${{ matrix.arch }}
          path: /tmp/digests/${{ matrix.arch }}
          if-no-files-found: error
          retention-days: 1

  merge:
    needs: build
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.gh_token || secrets.GITHUB_TOKEN }}

      - name: Download per-arch digests
        uses: actions/download-artifact@v8
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Resolve version
        id: version
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          # Multi-component release-please tags now have a `<component>-v` prefix
          # (e.g., `server-v0.18.0`). Strip the optional component prefix and the
          # leading `v` to get the bare semver for use as the Docker tag.
          VERSION="${RAW_TAG#server-}"
          VERSION="${VERSION#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve version from tag '$RAW_TAG'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing immutable tag
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          # `docker manifest inspect` returns 0 if the tag exists.
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag $IMAGE:$VERSION already exists — refusing to overwrite an immutable tag." >&2
            exit 1
          fi

      - name: Extract Docker metadata (immutable tags)
        id: meta_immutable
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short,prefix=sha-

      - name: Create immutable manifest list from per-arch digests
        env:
          TAGS: ${{ steps.meta_immutable.outputs.tags }}
        run: |
          set -euo pipefail
          # Each downloaded file is one arch; its content is the bare digest.
          REFS=""
          for f in /tmp/digests/*; do
            REFS="$REFS ${IMAGE}@sha256:$(cat "$f")"
          done
          TAGARGS=""
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            TAGARGS="$TAGARGS -t $TAG"
          done <<< "$TAGS"
          echo "Creating manifest list:$TAGARGS from$REFS"
          # shellcheck disable=SC2086
          docker buildx imagetools create $TAGARGS $REFS

      - name: Verify manifest advertises both platforms
        env:
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail
          INSPECT=$(docker buildx imagetools inspect "$IMAGE:$VERSION")
          echo "$INSPECT"
          echo "$INSPECT" | grep -q 'linux/amd64' || { echo "::error::manifest list missing linux/amd64" >&2; exit 1; }
          echo "$INSPECT" | grep -q 'linux/arm64' || { echo "::error::manifest list missing linux/arm64" >&2; exit 1; }

      - name: Extract Docker metadata (alias tags — only promoted after smoke passed)
        id: meta_aliases
        uses: docker/metadata-action@v6
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=match,pattern=^(\d+\.\d+)\.\d+$,group=1,value=${{ steps.version.outputs.version }}
            type=match,pattern=^(\d+)\.\d+\.\d+$,group=1,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Promote alias tags (:latest, major, minor)
        env:
          VERSION: ${{ steps.version.outputs.version }}
          ALIAS_TAGS: ${{ steps.meta_aliases.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Promoting alias: $TAG -> $IMAGE:$VERSION"
            docker buildx imagetools create -t "$TAG" "$IMAGE:$VERSION"
          done <<< "$ALIAS_TAGS"
