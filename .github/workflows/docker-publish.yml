name: Docker publish

# Triggered automatically from release-please.yml (workflow_call) when
# release-please cuts a new GH release. Also exposed via workflow_dispatch
# for manual recovery / first-time bootstrap before release-please has
# been used. The `release.created` event is intentionally NOT a trigger:
# GitHub silently drops events generated by GITHUB_TOKEN, which is what
# release-please uses, so a `release` trigger would never fire.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.13.0 or 0.13.0). Manual recovery only.'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.13.0 or 0.13.0).'
        required: true
        type: string
    secrets:
      gh_token:
        description: "Token with `packages: write`. Defaults to the caller workflow's GITHUB_TOKEN."
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v6
        with:
          ref: ${{ inputs.tag }}

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v4

      - name: Log in to GHCR
        uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.gh_token || secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve version from tag '$RAW_TAG'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing immutable tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rembric
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `docker manifest inspect` returns 0 if the tag exists.
          # Use a registry probe instead of pulling the manifest, to avoid
          # racing with concurrent pushes.
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag $IMAGE:$VERSION already exists — refusing to overwrite an immutable tag." >&2
            exit 1
          fi

      - name: Extract Docker metadata (immutable tags)
        id: meta_immutable
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rembric
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=sha,format=short,prefix=sha-

      - name: Build and push immutable tags (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v7
        with:
          context: .
          file: ./Dockerfile
          target: runtime
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta_immutable.outputs.tags }}
          labels: ${{ steps.meta_immutable.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Smoke test published image (three independent signals)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rembric
          VERSION: ${{ steps.version.outputs.version }}
        run: |
          set -euo pipefail

          # Pull the just-pushed immutable tag (linux/amd64 on the runner).
          docker pull "$IMAGE:$VERSION"

          CMD_JSON=$(docker inspect "$IMAGE:$VERSION" --format '{{json .Config.Cmd}}')
          ENT_JSON=$(docker inspect "$IMAGE:$VERSION" --format '{{json .Config.Entrypoint}}')
          LABEL=$(docker inspect "$IMAGE:$VERSION" --format '{{ index .Config.Labels "rembric.stage" }}')
          SIZE_BYTES=$(docker inspect "$IMAGE:$VERSION" --format '{{.Size}}')
          SIZE_MB=$(( SIZE_BYTES / 1024 / 1024 ))

          echo "Cmd:        $CMD_JSON"
          echo "Entrypoint: $ENT_JSON"
          echo "Label:      rembric.stage=$LABEL"
          echo "Size:       ${SIZE_MB} MB (${SIZE_BYTES} bytes)"
          echo ""

          fail=0

          if echo "$CMD_JSON $ENT_JSON" | grep -q 'seed-dev'; then
            echo "::error::Signal 1 FAILED: 'seed-dev' found in Cmd or Entrypoint." >&2
            fail=1
          fi
          if echo "$CMD_JSON $ENT_JSON" | grep -q 'tsx watch'; then
            echo "::error::Signal 1 FAILED: 'tsx watch' found in Cmd or Entrypoint." >&2
            fail=1
          fi
          if ! echo "$ENT_JSON" | grep -q 'dist/server-entrypoint.js'; then
            echo "::error::Signal 1 FAILED: Entrypoint does not include 'dist/server-entrypoint.js'." >&2
            fail=1
          fi

          if [ "$LABEL" != "runtime" ]; then
            echo "::error::Signal 2 FAILED: rembric.stage label is '$LABEL' (expected 'runtime')." >&2
            fail=1
          fi

          MAX_MB=800
          if [ "$SIZE_MB" -gt "$MAX_MB" ]; then
            echo "::error::Signal 3 FAILED: image size ${SIZE_MB} MB exceeds ${MAX_MB} MB threshold." >&2
            fail=1
          fi

          if [ "$fail" -ne 0 ]; then
            echo "" >&2
            echo "::error::Smoke test FAILED. Immutable tags ($IMAGE:$VERSION, sha-...) remain in the registry as forensic evidence. Alias tags (:latest, major/minor) WILL NOT be promoted." >&2
            exit 1
          fi
          echo "✓ All three smoke-test signals passed; safe to promote alias tags."

      - name: Extract Docker metadata (alias tags — only promoted after smoke test)
        id: meta_aliases
        uses: docker/metadata-action@v6
        with:
          images: ghcr.io/${{ github.repository_owner }}/rembric
          tags: |
            type=match,pattern=^(\d+\.\d+)\.\d+$,group=1,value=${{ steps.version.outputs.version }}
            type=match,pattern=^(\d+)\.\d+\.\d+$,group=1,value=${{ steps.version.outputs.version }}
            type=raw,value=latest

      - name: Promote alias tags (:latest, major, minor)
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rembric
          VERSION: ${{ steps.version.outputs.version }}
          ALIAS_TAGS: ${{ steps.meta_aliases.outputs.tags }}
        run: |
          set -euo pipefail
          while IFS= read -r TAG; do
            [ -z "$TAG" ] && continue
            echo "Promoting alias: $TAG -> $IMAGE:$VERSION"
            docker buildx imagetools create -t "$TAG" "$IMAGE:$VERSION"
          done <<< "$ALIAS_TAGS"
