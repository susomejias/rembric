name: Docker publish

# Triggered automatically from release-please.yml (workflow_call) when
# release-please cuts a new GH release. Also exposed via workflow_dispatch
# for manual recovery / first-time bootstrap before release-please has
# been used. The `release.created` event is intentionally NOT a trigger:
# GitHub silently drops events generated by GITHUB_TOKEN, which is what
# release-please uses, so a `release` trigger would never fire.

on:
  workflow_dispatch:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.13.0 or 0.13.0). Manual recovery only.'
        required: true
        type: string
  workflow_call:
    inputs:
      tag:
        description: 'Tag to publish (e.g. v0.13.0 or 0.13.0).'
        required: true
        type: string
    secrets:
      gh_token:
        description: "Token with `packages: write`. Defaults to the caller workflow's GITHUB_TOKEN."
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: docker-publish-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.tag }}

      - name: Set up QEMU (for arm64 emulation)
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.gh_token || secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: version
        env:
          RAW_TAG: ${{ inputs.tag }}
        run: |
          set -euo pipefail
          VERSION="${RAW_TAG#v}"
          if [ -z "$VERSION" ]; then
            echo "::error::Could not resolve version from tag '$RAW_TAG'" >&2
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"

      - name: Refuse to overwrite an existing immutable tag
        env:
          IMAGE: ghcr.io/${{ github.repository_owner }}/rembric
          VERSION: ${{ steps.version.outputs.version }}
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          # `docker manifest inspect` returns 0 if the tag exists.
          # Use a registry probe instead of pulling the manifest, to avoid
          # racing with concurrent pushes.
          if docker manifest inspect "$IMAGE:$VERSION" > /dev/null 2>&1; then
            echo "::error::Tag $IMAGE:$VERSION already exists — refusing to overwrite an immutable tag." >&2
            exit 1
          fi

      - name: Extract Docker metadata (tag matrix)
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ghcr.io/${{ github.repository_owner }}/rembric
          tags: |
            type=raw,value=${{ steps.version.outputs.version }}
            type=match,pattern=^(\d+\.\d+)\.\d+$,group=1,value=${{ steps.version.outputs.version }}
            type=match,pattern=^(\d+)\.\d+\.\d+$,group=1,value=${{ steps.version.outputs.version }}
            type=raw,value=latest
            type=sha,format=short,prefix=sha-

      - name: Build and push (linux/amd64, linux/arm64)
        uses: docker/build-push-action@v5
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
