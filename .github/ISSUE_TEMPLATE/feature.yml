name: Feature request
description: Suggest a new capability, integration, or improvement
title: 'feat: '
labels: ['enhancement']
body:
  - type: markdown
    attributes:
      value: |
        Thanks for the idea! The most useful requests describe the **problem** you hit, not only the solution
        you have in mind — that leaves room to find the design that fits Rembric's model (append-only memory,
        project scoping, one implementation shared by every client).

        Behaviour changes such as a new MCP tool or HTTP endpoint go through a spec-driven
        [OpenSpec](https://github.com/susomejias/rembric/tree/main/openspec) change before implementation.
        This issue is the right first step; the maintainer will follow up with the change if the direction is agreed.

  - type: textarea
    id: problem
    attributes:
      label: Problem
      description: What are you trying to do, and what gets in the way today? Concrete situations help most.
      placeholder: |
        When my agent works across two repos of the same product, it cannot recall decisions saved in the other one,
        so I end up re-explaining …
    validations:
      required: true

  - type: textarea
    id: proposal
    attributes:
      label: Proposed solution
      description: How would it work from your side? A tool call, a dashboard page, a config option, an agent behaviour…
    validations:
      required: true

  - type: textarea
    id: alternatives
    attributes:
      label: Alternatives and workarounds
      description: What have you tried or considered, and why is it not enough?

  - type: dropdown
    id: surface
    attributes:
      label: Affected surface
      multiple: true
      options:
        - MCP tools / memory behaviour
        - Dashboard
        - HTTP API
        - Agent plugin — Claude Code
        - Agent plugin — Codex CLI
        - Agent plugin — Hermes Agent
        - Agent plugin — opencode
        - Agent plugin — Pi
        - Installer
        - Docker image / deployment
        - Documentation
        - Other / not sure
    validations:
      required: true

  - type: dropdown
    id: contribute
    attributes:
      label: Would you like to work on it?
      options:
        - 'No, just suggesting it'
        - "Yes, I'd like to open a PR once the direction is agreed"
        - 'Maybe, with some guidance'
    validations:
      required: true

  - type: checkboxes
    id: confirms
    attributes:
      label: Confirmations
      options:
        - label: I searched [existing issues](https://github.com/susomejias/rembric/issues?q=is%3Aissue) and could not find a duplicate request.
          required: true
