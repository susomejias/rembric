# Traefik labels for an existing rembric process.
# If you run rembric inside a container you control, add these
# labels to its service in your docker-compose.yml.

labels:
  - 'traefik.enable=true'
  - 'traefik.http.routers.rembric.rule=Host(`rembric.example.com`)'
  - 'traefik.http.routers.rembric.entrypoints=websecure'
  - 'traefik.http.routers.rembric.tls.certresolver=letsencrypt'
  - 'traefik.http.services.rembric.loadbalancer.server.port=8787'
  # Long timeouts for MCP Streamable HTTP
  - 'traefik.http.services.rembric.loadbalancer.responseforwarding.flushinterval=100ms'
