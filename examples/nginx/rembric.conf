# rembric behind Nginx with TLS terminated by Certbot.
# Replace rembric.example.com with your domain.

server {
    listen 443 ssl http2;
    server_name rembric.example.com;

    ssl_certificate     /etc/letsencrypt/live/rembric.example.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/rembric.example.com/privkey.pem;

    # MCP Streamable HTTP needs long-lived connections.
    location /mcp {
        proxy_pass http://127.0.0.1:8787;
        proxy_http_version 1.1;
        proxy_set_header Connection "";
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_buffering off;
        proxy_read_timeout 1h;
        proxy_send_timeout 1h;
    }

    location / {
        proxy_pass http://127.0.0.1:8787;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name rembric.example.com;
    return 301 https://$host$request_uri;
}
